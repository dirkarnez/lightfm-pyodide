<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
  <link rel="stylesheet" href="https://meyerweb.com/eric/tools/css/reset/reset.css" type="text/css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/pyodide/v0.27.3/full/pyodide.js"></script>
    <script type="text/javascript">
      async function main() {
        let pyodide = await loadPyodide();
        await pyodide.loadPackage("micropip");
        const micropip = pyodide.pyimport("micropip");
        await micropip.install("https://github.com/dirkarnez/lightfm-pyodide/releases/download/v1.17/lightfm-1.17-cp312-cp312-pyodide_2024_0_wasm32.whl" /*"https://localhost:80/lightfm-1.17-cp312-cp312-pyodide_2024_0_wasm32.whl"*/);
        await pyodide.runPython(`
        import lightfm
        from lightfm.data import Dataset

        dataset = Dataset()
        print(dataset)
      `);
      }
      main();
    </script>
</body>
</html>
